  declared_on: []
  observed: true
  remediation: >-
    Application-level operations need HTTP Basic with App ID as username and App Secret Key as
    password. Player-scoped operations need the Bearer JWT delivered to the application's webhook
    on AuthenticationSuccess. A 401 is also what an inactivated application receives.
  note: >-
    UNDECLARED. Every operation in the spec carries a security requirement, but not one declares a
    401 response. This is the single largest gap in the contract's error surface.
  source: live probe 2026-09-02
