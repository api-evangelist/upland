asynchronous_failures:
  note: >-
    Upland's real failure semantics for asset movement are NOT carried in HTTP status codes. An
    escrow or tournament call returns 2xx and the outcome arrives later as a webhook notification.
    An integrator that only handles HTTP errors will miss every asset-level failure.
  events:
  - type: AuthenticationFailure
    carries: code, message
    meaning: The player's connection code expired or the authorization flow failed.
  - type: TransactionToEscrowFailure
    carries: containerId, transactionId, ownerEosId, message
    meaning: The asset transfer into escrow failed at finalization.
  - type: TransactionToEscrowExpired
    carries: containerId, transactionId, ownerEosId
    meaning: The player did not sign within the 10-minute window.
  - type: TransactionToEscrowRejected
    carries: containerId, transactionId, ownerEosId
    meaning: The player explicitly rejected the request.
  - type: TransactionFromEscrowFailure
    carries: containerId, transactionId
    meaning: The container resolution transaction failed.
  - type: ContainerExpired
    carries: containerId
    meaning: The container expired before resolution; assets are returned to their original owners.
  - type: RumbleTournamentStatusUpdated
    carries: appId, tournamentId, transactionId, status, error
    meaning: 'Status FAILED with an optional `error` string is the tournament-level failure channel.'
  source: https://docs.developers.upland.me/upland-developers/api-definitions/webhooks-notifications
status_vocabularies:
  escrow_transaction_status:
    source: https://docs.developers.upland.me/upland-developers/api-definitions/escrow-container-management
    values:
    - value: expired
      meaning: Transaction not accepted or rejected in time.
    - value: rejected
      meaning: Transaction the player rejected.
    - value: user_signature_requested
      meaning: The application has sent the request to the player.
    - value: changing_ownership
      meaning: The transaction is being registered on the blockchain; can take up to three minutes.
    - value: in_escrow
      meaning: Assets are inside the container and ready for resolution.
    - value: refunded
      meaning: Assets were given back to the players.
    - value: removed
      meaning: Transaction deleted from the container before the player accepted or rejected it.
  tournament_status:
    source: https://docs.developers.upland.me/upland-developers/api-definitions/webhooks-notifications
    values: [WAITING_FOR_PARTICIPANTS, WAITING_PAYMENT, REGISTRATION_CLOSED, IN_PROGRESS, DISTRIBUTING_PRIZES, CLOSED, FAILED]
  participant_status:
    source: https://docs.developers.upland.me/upland-developers/api-definitions/webhooks-notifications
    values: [WAITING_PAYMENT, PROCESSING_PAYMENT, ACTIVE, REMOVED]
gaps:
- No published error-code reference page anywhere in the developer documentation.
- 401 is undeclared on all 46 operations despite every operation requiring credentials.
- No 5xx response is declared on any operation.
- No RFC 9457 application/problem+json, no type URI, no instance, no machine-readable error code.
- No Retry-After or retry guidance on any failure.
