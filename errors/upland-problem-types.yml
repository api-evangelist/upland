format: nest-http-exception
rfc9457: false
summary: >-
  Upland does not publish an error reference and its OpenAPI declares 4xx responses on only four of
  46 operations. The runtime envelope is the NestJS default HttpException body, confirmed by live
  probe, not RFC 9457 application/problem+json. There is no error code namespace, no error id, no
  documentation link and no retry hint anywhere in the contract or the docs.
envelope:
  content_type: application/json
  shape:
    statusCode: integer, mirrors the HTTP status
    message: string, human-readable; occasionally an array of validation strings on 400
    error: string, the HTTP reason phrase; present on framework-generated errors, absent on some handler-generated ones
  observed_examples:
  - request: GET https://api.prod.upland.me/developers-api/cities (no credentials)
    status: 401
    body: '{"statusCode":401,"message":"Unauthorized"}'
    note: '`error` key absent.'
  - request: GET https://api.prod.upland.me/developers-api/nope
    status: 404
    body: '{"statusCode":404,"message":"Cannot GET /nope","error":"Not Found"}'
  schema_in_spec: '#/components/schemas/HttpErrorDto'
