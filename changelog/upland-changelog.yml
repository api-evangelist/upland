  breaking: false
  additions:
  - Car records now return all LODs and stats for the searched car.
  - New endpoint to query all sent webhooks.
  highlights: 'The webhook-query endpoint is GET /app-usage/webhook-calls (AppUsageController_findWebhookCalls).'
- label: August - 10th
  date: null
  url: https://docs.developers.upland.me/upland-developers/release-notes/august-10th
  breaking: false
  additions:
  - Impound Grounds introduced, where players collect 3D assets received from third-party app transactions.
  - Third-party developers may again use 3D assets (vehicles, map assets, ornaments) in escrow transactions.
  highlights: Reverses part of the April 27 withdrawal of 3D asset categories from escrow.
- label: July - 10th
  date: null
