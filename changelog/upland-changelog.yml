- label: September - 21st
  date: null
  url: https://docs.developers.upland.me/upland-developers/release-notes/september-21st
  breaking: false
  additions:
  - Tournament APIs released.
  - Escrow containers gained a player limit; developers can now define how many players may join a container.
  highlights: >-
    The largest addition in the window. Sixteen Tournament operations are visible in the live
