summary: >-
  Upland ships dated release notes and one genuinely deprecated operation, and it executed a full
  blockchain migration with published cut-over block and timestamp. It publishes no versioning
  policy, no deprecation policy, no Sunset/Deprecation headers, no SLA and no status page.
versioning:
  scheme: path-prefix, applied to a single resource
  spec_version: 1.0.0
  docs_bundle_version: 1.0.6
  note: >-
    info.version in the live contract reads 1.0.0 while the copy embedded in the GitBook docs is
    named developers-api-v.1.0.6.json — the two disagree, and neither is dated. /v2/properties is
    the only versioned path. There is no version header, no version query parameter and no media
    type versioning.
  policy_published: false
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  deprecated_operations:
  - operationId: PropertiesController_getProperties
    method: GET
    path: /properties
    summary: List properties (Deprecated)
    replacement: GET /v2/properties (PropertiesController_getPropertiesWithNextPagePagination)
    sunset_date: null
    note: >-
      Flagged `deprecated: true` in the OpenAPI and labelled "(Deprecated)" in its summary. No sunset
      date, no removal notice and no Deprecation/Sunset response header. The replacement changes the
      pagination contract from currentPage/pageSize to nextPageToken, so it is a breaking migration
      for any consumer.
    source: openapi/upland-developers-api-openapi.json
  withdrawn_capabilities:
  - what: Structure Ornaments, Outdoor Decors and Cars removed from escrow containers in production
    when: April 27 release note
    reason: The crates mechanism.
    restored: Partially — the August 10 release note reinstates 3D assets (vehicles, map assets, ornaments) for escrow transactions via Impound Grounds.
    source: https://docs.developers.upland.me/upland-developers/release-notes/april-27th
