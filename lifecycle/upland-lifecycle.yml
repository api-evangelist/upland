application_lifecycle:
  states: [created, submitted, approved/active, inactivated, reactivated]
  note: >-
    Applications have their own lifecycle independent of the API. Inactivating and reactivating an
    application is the only credential-rotation path, and it issues a new access token, breaking
    live integrations. A Dev Shop registration is required before an application may run in
    production.
  docs:
  - https://docs.developers.upland.me/upland-developers/application-management/inactivating-an-application
  - https://docs.developers.upland.me/upland-developers/application-management/activating-an-application
