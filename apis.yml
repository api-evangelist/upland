- name: Upland Appchain History & Chain API
  description: >-
    Public, unauthenticated Antelope (Leap 5.0.3) node and Hyperion 3.3.10 full-history API for
    Upland's own appchain, which replaced Upland's EOS deployment on 2025-04-26. Exposes the standard
    Antelope /v1/chain RPC (get_info, get_account, get_table_rows, get_abi, push_transaction and
    friends) plus Hyperion V1 and V2 history, state and stats endpoints for indexed actions, deltas,
    transactions, token holders, account creators, proposals and resource usage. Documented by Upland
    on its own Upland Appchain developer page alongside the ledger.upland.me block explorer.
  humanURL: https://docs.developers.upland.me/upland-developers/api-definitions/upland-appchain
  baseURL: https://chain-history.upland.me
