apis:
- name: Upland Developers API
  description: >-
    REST API for approved Upland third-party applications. Maps application users to Upland user IDs
    through a connection-code flow, exposes read-only player data (profile, balances, properties,
    NFTs, travels), manages an application-scoped escrow container (create, lock/unlock, refresh
    expiration, resolve, refund, remove transaction), runs Rumble tournaments (settings, create,
    join, scores, prize distribution, scoreboard, resolve, cancel), and queries Dev Shops, cities,
    neighborhoods, collections, buildings, tracks and treasures history. Application-level calls use
    HTTP Basic auth (App ID + Secret Key); calls acting on behalf of a player use a Bearer JWT
    delivered to the application's webhook URL when the player authorizes the connection.
  humanURL: https://docs.developers.upland.me/upland-developers
  baseURL: https://api.prod.upland.me/developers-api
