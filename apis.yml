aid: upland
name: Upland
description: >-
  Upland (Uplandme, Inc.) is a San Francisco-based Web3 metaverse company that maps virtual property
  onto real-world addresses, letting players buy, sell, trade and build on tokenized parcels of real
  cities using its in-world currency UPX and the SPARKLET token. Upland runs a public third-party
  Developer Program: the Upland Developers API is a documented REST contract (OpenAPI 3.0, 46
  operations across Authentication, Upland User, Escrow Containers, Tournaments, Dev Shops,
  Application Usage and generic read-only endpoints) that lets an approved application map its own
  users to Upland user IDs, read a player's profile, balances, properties and NFTs, place player
  assets into an application-scoped escrow container, run Rumble tournaments with UPX entry fees and
  prize distribution, and receive eighteen documented webhook notifications. A parallel sandbox
  environment mirrors production. Upland also operates its own Antelope (Leap 5.0.3) appchain, whose
  chain RPC and Hyperion full-history API are publicly callable and documented.
image: https://www.upland.me/images/seo/graph.png?v=3
