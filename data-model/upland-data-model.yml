source: openapi/upland-developers-api-openapi.json
summary: >-
  Derived from the 67 component schemas of the Upland Developers API by following $ref links and
  id-reference fields. The graph has three clusters that barely touch: a WORLD cluster (city,
  neighborhood, collection, property, building, track) that is pure reference data, a PLAYER cluster
  (user, profile, balances, NFTs, properties, travels) reachable only with a player token, and an
  APPLICATION cluster (application, escrow container, asset transfer, tournament, participant,
  score) where every write lives. The Escrow Container is the hinge: it is the only entity that
  holds assets belonging to players on behalf of an application.
identifier_conventions:
  uuid: userId, transactionId, participantId, tournamentId, settingsId, registrationTransactionId, resolutionTransactionId
  numeric: containerId, appId, propertyId, id
  chain_account: eosId, ownerEosId, userEosId, targetEosId, stakeholderEosId
  note: >-
    `eosId` naming survives the migration off EOS onto Upland's own Antelope appchain. It is the
    on-chain account name that owns an asset, and it is the join key between this REST API and the
    chain/history APIs at chain-api.upland.me and chain-history.upland.me.
