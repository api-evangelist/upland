cross_api_join:
  note: >-
    The REST API and the appchain APIs share one join key. An `eosId` from
    UserProfileResponseDto or AssetTransferRequestResponseDto can be looked up directly against
    https://chain-history.upland.me/v2/state/get_account and /v2/history/get_actions, and against
    https://chain-api.upland.me/v1/chain/get_account. This is the only documented path from an
    application-level asset movement to its on-chain record.
