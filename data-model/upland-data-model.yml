gaps:
- No id-prefix convention (no obj_ / cus_ style prefixes) to identify an object type from its id alone.
- Application is not modelled as a response schema; it exists only as appId on webhook payloads.
- The chain join key is named eosId although Upland no longer runs on EOS.
